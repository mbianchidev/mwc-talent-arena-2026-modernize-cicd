server {
    listen       3000;
    server_name  localhost;

    # ---- Frontend static files ----
    root   /usr/share/nginx/html;
    index  index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- Reverse-proxy to TomEE backend ----
    location /reconciliator/ {
        proxy_pass         http://backend:8080/reconciliator/;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Strip browser cookies before forwarding to backend —
        # TomEE rejects requests with large headers (default 8 KB)
        # and the backend API does not use cookies at all.
        proxy_set_header Cookie "";
    }
}
