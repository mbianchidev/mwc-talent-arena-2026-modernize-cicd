server {
    listen 3000;
    server_name localhost;

    # Increase header buffer sizes to avoid 400 on large cookies/headers
    large_client_header_buffers 4 32k;

    root /usr/share/nginx/html;
    index index.html;

    # Serve static frontend files
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy API requests to the backend service
    # 127.0.0.11 is Docker's embedded DNS server for container name resolution
    location /reconciliator/api/ {
        resolver 127.0.0.11 valid=30s;
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Strip browser cookies before forwarding to backend —
        # TomEE rejects requests with large headers (default 8 KB)
        # and the backend API does not use cookies at all.
        proxy_set_header Cookie "";
    }
}
