# ---------------------------------------------------------------------------
#  TelcoRec — Docker Compose setup
#  Two services: backend (TomEE + H2) and frontend (Nginx)
# ---------------------------------------------------------------------------

services:

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: telcorec-backend
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - h2-data:/data/db
    networks:
      - telcorec-net
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/reconciliator/api/customers"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 4

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: telcorec-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    networks:
      - telcorec-net
    depends_on:
      backend:
        condition: service_healthy

volumes:
  h2-data:
    driver: local

networks:
  telcorec-net:
    driver: bridge
